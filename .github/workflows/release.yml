name: Release APK
on:
  workflow_dispatch:
    inputs:
      version:
        description: "1.3"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
      - name: Buat Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "Win11Launcher-v${VERSION}.apk"
          gh release create "v${VERSION}" "Win11Launcher-v${VERSION}.apk" \
            --title "Win11 Launcher v${VERSION}" \
            --generate-notes
